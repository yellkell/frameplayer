[package]
name = "fp-render"
version = "0.1.0"
description = "FramePlayer Vulkan renderer: per-pixel VR projections, YUV video, egui panels"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
ash = "0.38"
bytemuck = { version = "1", features = ["derive"] }
egui = { version = "0.32.3", features = ["bytemuck"] }
fp-core = { path = "../fp-core" }
fp-media = { path = "../fp-media" }
glam = { version = "0.33", features = ["bytemuck"] }
gpu-allocator = { version = "0.28", default-features = false, features = ["vulkan", "std"] }
log = "0.4"
thiserror = "2"

[build-dependencies]
naga = { version = "28", features = ["wgsl-in", "spv-out"] }

[dev-dependencies]
png = "0.18"
