[package]
name = "fp-audio"
description = "FramePlayer audio: output backends, audio master clock, downmix, resampling, WSOLA time stretch, ambisonics + binaural HRTF."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Real audio output through cpal. `alsa` uses the ALSA host directly; on
# SteamOS PipeWire provides the ALSA PCM plugin, so `pipewire` currently maps
# to the same cpal backend (cpal's default host routes through pipewire-alsa).
cpal = ["dep:cpal"]
alsa = ["cpal"]
pipewire = ["cpal"]

[dependencies]
fp-core.workspace = true
glam.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
tracing.workspace = true
rustfft = "6"
cpal = { version = "0.15", optional = true }
