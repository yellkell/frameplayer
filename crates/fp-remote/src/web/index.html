<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>FramePlayer Remote</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="bar">
  <h1>FramePlayer</h1>
  <span id="conn" class="conn" role="status" aria-live="polite">Connecting…</span>
</header>
<main>
  <section class="card" aria-labelledby="np-h">
    <h2 id="np-h" class="eyebrow">Now playing</h2>
    <p id="np-title" class="title">Nothing playing</p>
    <div class="seek">
      <input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek position" disabled>
      <div class="times" aria-hidden="true"><span id="pos">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="transport">
      <button id="back" type="button" aria-label="Back 10 seconds">−10 s</button>
      <button id="play" type="button" class="primary" aria-label="Play">Play</button>
      <button id="fwd" type="button" aria-label="Forward 10 seconds">+10 s</button>
    </div>
    <div class="row">
      <label for="speed">Speed</label>
      <select id="speed">
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
      <span class="spacer"></span>
      <button id="recenter" type="button">Recenter</button>
      <button id="stop" type="button">Stop</button>
    </div>
  </section>

  <section class="card" aria-labelledby="type-h">
    <h2 id="type-h" class="eyebrow">Type into headset</h2>
    <form id="type-form" class="row" autocomplete="off">
      <label for="type-text" class="sr-only">Text to send to the headset</label>
      <input id="type-text" type="text" autocapitalize="off" spellcheck="false" maxlength="4096" placeholder="Search terms or URL">
      <button type="submit" class="primary">Send</button>
    </form>
    <p id="type-status" class="hint" role="status" aria-live="polite"></p>
  </section>

  <section class="card" aria-labelledby="lib-h">
    <h2 id="lib-h" class="eyebrow">Library</h2>
    <form id="search-form" class="row" role="search" autocomplete="off">
      <label for="q" class="sr-only">Search library</label>
      <input id="q" type="search" placeholder="Search library" maxlength="256">
      <button type="submit">Search</button>
    </form>
    <p id="lib-status" class="hint" role="status" aria-live="polite"></p>
    <ul id="results" class="results"></ul>
    <button id="more" type="button" class="wide" hidden>Load more</button>
  </section>
</main>
</body>
</html>
