[package]
name = "fp-video"
description = "FramePlayer video: demux (MP4/MOV, Matroska/WebM, optional ffmpeg), V4L2 hardware decode with DMA-BUF export, software fallback, playback engine, subtitles, thumbnails."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["aac"]
# Pure-Rust AAC-LC decoding (symphonia) so MP4/MKV audio plays without ffmpeg.
aac = ["dep:symphonia-core", "dep:symphonia-codec-aac"]
# libavformat demuxer (TS, AVI, …) + libavcodec software video/audio decode.
# Links FFmpeg 7.1 shared libraries found via pkg-config; release builds use
# the LGPL-only build from tools/build-codecs.sh (source its env.sh first).
ffmpeg = ["dep:ffmpeg-next"]
# dav1d software AV1 decoder (libdav1d >= 1.3 via pkg-config; build-codecs.sh
# provides a static one).
dav1d = ["dep:dav1d"]

[dependencies]
fp-core.workspace = true
fp-audio.workspace = true
crossbeam-channel.workspace = true
glam.workspace = true
libc.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
tracing.workspace = true

symphonia-core = { version = "0.5", optional = true }
symphonia-codec-aac = { version = "0.5", optional = true }
# Only the libraries fp-video uses: no libavdevice/libavfilter.
ffmpeg-next = { version = "7", optional = true, default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
dav1d = { version = "0.10", optional = true }
