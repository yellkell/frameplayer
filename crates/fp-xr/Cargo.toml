[package]
name = "fp-xr"
version = "0.1.0"
description = "FramePlayer OpenXR integration: runtime loading, Vulkan session, swapchains, input"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
ash = "0.38"
fp-render = { path = "../fp-render" }
glam = "0.33"
libloading = "0.8"
log = "0.4"
openxr = { version = "0.22.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
