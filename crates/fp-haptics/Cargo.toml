[package]
name = "fp-haptics"
version = "0.1.0"
description = "Synchronises interactive devices (TCode, Buttplug/Intiface, The Handy) with video playback from funscripts"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
fp-core = { path = "../fp-core" }
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
# Buttplug / Intiface: plain ws:// (Intiface runs on the same machine or LAN).
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
# The Handy cloud API: HTTPS through rustls (ring provider), no OpenSSL.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[dev-dependencies]
tiny_http = "0.12"
