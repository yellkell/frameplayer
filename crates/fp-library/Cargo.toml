[package]
name = "fp-library"
version = "0.1.0"
description = "FramePlayer media library: SQLite index, folder scanner, metadata and thumbnail worker"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
fp-core = { path = "../fp-core" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
jpeg-encoder = "0.6"

[dev-dependencies]
tempfile = "3"
