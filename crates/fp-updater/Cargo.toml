[package]
name = "fp-updater"
version = "0.1.0"
description = "FramePlayer self-update: signed release manifests, resumable verified downloads, atomic install and rollback"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.3"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
# rustls with webpki roots and no gzip, so Range requests get raw bytes.
# No OpenSSL anywhere in the tree.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Pure-Rust inflate (zlib-rs backend); no C zlib, bzip2, zstd or lzma.
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
