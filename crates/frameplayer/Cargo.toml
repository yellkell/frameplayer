[package]
name = "frameplayer"
version = "0.1.0"
description = "Native VR video player for the Valve Steam Frame"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ash = "0.38"
base64 = "0.22"
crossbeam-channel = "0.5"
egui = { version = "0.32.3", features = ["bytemuck"] }
fp-core = { path = "../fp-core" }
fp-haptics = { path = "../fp-haptics" }
fp-library = { path = "../fp-library" }
fp-media = { path = "../fp-media" }
fp-remote = { path = "../fp-remote" }
fp-render = { path = "../fp-render" }
fp-sources = { path = "../fp-sources" }
fp-updater = { path = "../fp-updater" }
fp-xr = { path = "../fp-xr" }
glam = "0.33"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# DevTools connection of the embedded web view (no TLS: loopback only).
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
png = "0.18"
