name: ci

on:
  push:
  pull_request:
  # Releases without pushing a tag first: run on the branch to release, with
  # the tag (v + the version in crates/frameplayer/Cargo.toml); the release
  # step creates the tag on the commit it built.
  workflow_dispatch:
    inputs:
      release:
        description: "Tag to release (v<version in crates/frameplayer/Cargo.toml>)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pinned so a new stable release's lints cannot break CI unannounced;
      # bump deliberately (and fix what its clippy reports).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm pkg-config mesa-vulkan-drivers zip
          # Ubuntu's meson (1.3) does not recognise zig's linker; use the
          # version the cross build is tested with.
          pipx install meson==1.12.1
          cargo install --locked cargo-zigbuild
      - name: Restore FFmpeg builds
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ hashFiles('tools/build-ffmpeg.sh') }}
      - name: Build FFmpeg (x86_64 for tests, aarch64 for the Frame)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: tools/build-ffmpeg.sh x86_64 aarch64
      # Saved right away, so a later failing step does not throw it away.
      - name: Save FFmpeg builds
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ hashFiles('tools/build-ffmpeg.sh') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/ffmpeg/x86_64/lib
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: cargo test --workspace
      # Every screen as a flat PNG, for design review (artifact ui-preview).
      - name: UI preview
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/ffmpeg/x86_64/lib
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: tools/ui-preview.sh ui-preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-preview
          path: ui-preview/
      # The Meta Quest build's screens, for its store screenshots.
      - name: UI preview (Quest)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/ffmpeg/x86_64/lib
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          QUEST_LOOK: "1"
        run: tools/ui-preview.sh ui-preview-quest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-preview-quest
          path: ui-preview-quest/
      - name: Package for the Steam Frame (aarch64, glibc 2.28)
        run: tools/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: frameplayer-aarch64
          path: dist/

  # The PC-side installer, for each desktop OS.
  installer:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            name: frameplayer-install-linux-x86_64
            exe: frameplayer-install
          - os: windows-latest
            name: frameplayer-install-windows-x86_64
            exe: frameplayer-install.exe
          - os: macos-latest
            name: frameplayer-install-macos-arm64
            exe: frameplayer-install
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p frameplayer-install
      - run: cargo build --release -p frameplayer-install
      - name: Stage
        shell: bash
        run: |
          mkdir -p out
          cp "target/release/${{ matrix.exe }}" "out/${{ matrix.name }}${{ endsWith(matrix.exe, '.exe') && '.exe' || '' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/

  # FramePlayer for Meta Quest (Android): FFmpeg with MediaCodec, the native
  # library and an APK. Signed with a key made for the run, for checking
  # only; the APK for a headset is signed locally (tools/package-quest.sh).
  # The FFmpeg build is uploaded too, so local builds can use it.
  quest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version code counts commits
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: quest
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config
          pipx install meson==1.12.1
          cargo install --locked cargo-ndk
      - name: Android NDK r27c
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Restore FFmpeg for Android
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/ffmpeg/android-aarch64
          key: ffmpeg-android-${{ hashFiles('tools/build-ffmpeg-android.sh', 'tools/ffmpeg-android-p010.patch') }}
      - name: Build FFmpeg for Android
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: tools/build-ffmpeg-android.sh
      - name: Save FFmpeg for Android
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/ffmpeg/android-aarch64
          key: ffmpeg-android-${{ hashFiles('tools/build-ffmpeg-android.sh', 'tools/ffmpeg-android-p010.patch') }}
      - name: Clippy (Android)
        run: cargo ndk -t arm64-v8a -P 29 clippy -p frameplayer-quest -- -D warnings
      - name: Package APK
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android             -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 30             -dname "CN=FramePlayer CI" -noprompt
          tools/package-quest.sh dist-quest
      - uses: actions/upload-artifact@v4
        with:
          name: frameplayer-quest
          path: dist-quest/
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-aarch64
          path: third_party/ffmpeg/android-aarch64/

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: [check, installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frameplayer-aarch64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: frameplayer-install-*
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Check the tag matches the version
        env:
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          version="$(grep -m1 '^version' src/crates/frameplayer/Cargo.toml | cut -d'"' -f2)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release $TAG does not match FramePlayer $version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Sign the update manifest
        env:
          FP_RELEASE_KEY: ${{ secrets.FP_RELEASE_KEY }}
        run: |
          if [ -z "$FP_RELEASE_KEY" ]; then
            echo "::error::FP_RELEASE_KEY secret not set; an unsigned manifest.json would be refused by in-app updates"
            exit 1
          fi
          umask 077
          printf '%s\n' "$FP_RELEASE_KEY" > "$RUNNER_TEMP/release.key"
          cargo run --manifest-path src/Cargo.toml --release -p fp-updater --bin fp-release -- sign dist/manifest.json --key "$RUNNER_TEMP/release.key"
          rm -f "$RUNNER_TEMP/release.key"
          # The signature must match the key FramePlayer builds carry.
          cargo run --manifest-path src/Cargo.toml --release -p fp-updater --bin fp-release -- verify dist/manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
